<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/Portfolio/flower.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anna Kovalenko Portfolio</title>
    <!-- Set the theme before first paint: saved choice, else the system setting -->
    <script>
      (function () {
        var theme;
        try {
          theme = localStorage.getItem("theme");
        } catch (e) {}
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <script type="module" crossorigin src="/Portfolio/assets/index-CrOyZVxJ.js"></script>
    <link rel="stylesheet" crossorigin href="/Portfolio/assets/index-BMdIdKQg.css">
